<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: "Arial", sans-serif; /* 简化字体声明 */
        }

        #togglePanelButton {
            position: absolute;
            bottom: 20px;
            right: 210px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
            transition: right 0.3s ease-in-out;
        }

        #togglePanelButton.hidden {
            right: 10px;
        }

        .toggle-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            transition: opacity 0.3s ease;
            background-color: #fff !important;
            backface-visibility: hidden;
            opacity: 1;
            forced-color-adjust: none;
        }

        .arrow-left {
            -webkit-clip-path: polygon(100% 0%, 0% 50%, 100% 100%);
            clip-path: polygon(100% 0%, 0% 50%, 100% 100%);
        }

        .arrow-right {
            -webkit-clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
        }

        #togglePanelButton .arrow-left {
            opacity: 0;
        }

        #togglePanelButton .arrow-right {
            opacity: 1;
        }

        #togglePanelButton.hidden .arrow-left {
            opacity: 1;
        }

        #togglePanelButton.hidden .arrow-right {
            opacity: 0;
        }

        #infoPanel {
            transition: transform 0.3s ease-in-out;
            background: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 200px;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
            box-sizing: border-box;
        }

        /* 滚动条样式 */
        #infoPanel::-webkit-scrollbar {
            width: 6px;
        }

        #infoPanel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        #infoPanel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        #infoPanel::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #materialPanel::-webkit-scrollbar {
            width: 6px;
        }

        #materialPanel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        #materialPanel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        #materialPanel::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #infoPanel.hidden {
            transform: translateX(100%);
        }

        .collapsible {
            cursor: pointer;
            font-weight: normal;
            background: rgba(30, 30, 30, 0.5);
            padding: 10px;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            transition: background 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            margin: 0;
        }

        .collapsible:first-of-type {
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }

        .collapsible.open {
            background: rgba(45, 45, 45, 0.7);
        }

        .collapsible.sub {
            margin-left: 0;
            padding-left: 20px;
            font-size: 13px;
            background: rgba(20, 20, 20, 0.4);
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0;
        }

        .collapsible.sub.open {
            background: rgba(30, 30, 30, 0.6);
        }

        .collapsible:active {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* 抽屉式菜单 - 整体容器边框 */
        .menu-section {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin-bottom: 0;
            overflow: hidden;
        }

        .menu-section > .collapsible {
            border-radius: 0;
        }

        .menu-section > .collapsible:first-child {
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease-in-out;
            background: rgba(15, 15, 15, 0.3);
        }

        .collapsible.open + .collapsible-content {
            max-height: 2000px;
        }

        .collapsible-content .control-group {
            margin: 0;
            padding: 8px;
            border: none;
            border-radius: 0;
            background: transparent;
        }

        .panel-section-title {
            font-size: 12px;
            margin: 6px 0 4px;
            color: rgba(255, 255, 255, 0.8);
        }

        .material-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: none;
            overflow-y: visible;
            padding-right: 0;
        }

        .material-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 2px solid transparent;
            border-radius: 50%;
            background: transparent;
            margin-bottom: 0;
            cursor: pointer;
            width: 24px;
            height: 24px;
            transition: border-color 0.3s ease-in-out, transform 0.2s ease;
        }

        .material-item:hover {
            transform: scale(1.15);
        }

        .material-item.active {
            border-color: rgba(255, 255, 255, 0.9);
        }

        .material-item .color-circle {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin: 0;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .material-item .material-name {
            display: none;
        }

        .collapsible-content label {
            display: block;
            font-size: 12px;
            margin: 6px 0 4px;
        }

        .collapsible-content input[type="range"],
        .collapsible-content select {
            width: 100%;
        }

        /* 颜色选择器样式 - 单独一行显示 */
        .collapsible-content input[type="color"] {
            display: block;
            width: 100%;
            height: 32px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        .collapsible-content input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        .collapsible-content input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 2px;
        }

        .range-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .range-row input[type="range"] {
            flex: 1;
        }

        .range-row input[type="number"] {
            width: 60px;
            background: rgba(20, 20, 20, 0.6);
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 2px 4px;
        }

        /* 加载进度遮罩 */
        #loadingBarContainer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: "Arial", sans-serif;
            font-size: 14px;
            font-weight: 300;
            color: white;
            z-index: 2000;
            background: #000;
        }

        #loadingBarLabel {
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        #loadingDots {
            display: inline-flex;
            align-items: center;
            margin-left: 6px;
        }

        #loadingDots span {
            opacity: 0.2;
            animation: dotBlink 1.0s infinite;
        }

        #loadingDots span:nth-child(1) { animation-delay: 0s; }
        #loadingDots span:nth-child(2) { animation-delay: 0.15s; }
        #loadingDots span:nth-child(3) { animation-delay: 0.30s; }

        @keyframes dotBlink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        #loadingPercent {
            font-size: 10px;
            opacity: 0.65;
            letter-spacing: 0.5px;
        }

        /* 左侧材质属性面板 */
        #materialPanel {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 200px;
            background: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 10px;
            padding-bottom: 20px;
            box-sizing: border-box;
            border-right: 1px solid #444;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            z-index: 1200;
            font-size: 14px;
        }

        #materialPanel.visible {
            transform: translateX(0);
        }

        /* 左侧折叠按钮 */
        #toggleLeftPanelButton {
            position: absolute;
            bottom: 20px;
            left: 10px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1100;
            transition: left 0.3s ease-in-out;
        }

        #toggleLeftPanelButton.panel-visible {
            left: 210px;
        }

        #toggleLeftPanelButton .arrow-right {
            opacity: 1;
        }

        #toggleLeftPanelButton .arrow-left {
            opacity: 0;
        }

        #toggleLeftPanelButton.panel-visible .arrow-right {
            opacity: 0;
        }

        #toggleLeftPanelButton.panel-visible .arrow-left {
            opacity: 1;
        }

        /* 材质复位/保存按钮 */
        #resetMaterialButton,
        #saveModelButton {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: white;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 18px;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #resetMaterialButton:hover,
        #saveModelButton:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .material-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .material-list-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
</head>
<body>
    <div id="loadingBarContainer">
        <div id="loadingBarLabel">Loading<span id="loadingDots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></div>
        <div id="loadingPercent">Created by Aye</div>
    </div>
    <canvas id="renderCanvas" style="width: 100vw; height: 100vh; visibility: hidden;"></canvas>
    <button id="togglePanelButton" class="hidden">
        <div class="toggle-arrow arrow-left"></div>
        <div class="toggle-arrow arrow-right"></div>
    </button>
    <button id="toggleLeftPanelButton">
        <div class="toggle-arrow arrow-left"></div>
        <div class="toggle-arrow arrow-right"></div>
    </button>
    <div id="materialPanel">
        <div class="menu-section">
            <div class="collapsible open">材质列表</div>
            <div class="collapsible-content">
                <div class="control-group">
                    <div class="material-list-header">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.8);">所有材质</span>
                        <span class="material-list-actions">
                            <button id="saveModelButton" title="保存为 GLB">💾</button>
                            <button id="resetMaterialButton" title="复位所有材质">↻</button>
                        </span>
                    </div>
                    <div id="materialList" class="material-list">
                        <!-- 材质列表 -->
                    </div>
                </div>
            </div>
        </div>
        <div class="menu-section">
            <div class="collapsible open" id="materialDetailHeader">材质详情</div>
            <div class="collapsible-content">
                <div id="materialProperties"></div>
            </div>
        </div>
    </div>
    <div id="infoPanel" class="hidden" style="position: absolute; top: 0; right: 0; height: 100%; color: white; font-size: 14px; padding: 10px; border-left: 1px solid #444;">
        <div class="menu-section">
            <div class="collapsible open">渲染表现</div>
            <div class="collapsible-content">
            <div class="collapsible sub open">控制</div>
            <div id="controlControls" class="collapsible-content">
                <div class="control-group">
                    <button id="resetCameraButton" style="width: 100%; padding: 6px;">复位视角</button>
                    <label for="mouseSensitivity">鼠标旋转灵敏度</label>
                    <div class="range-row">
                        <input type="range" id="mouseSensitivity" min="100" max="3000" step="50" value="800">
                        <input type="number" id="mouseSensitivityValue" min="100" max="3000" step="50" value="800">
                    </div>
                    <label for="keyboardMoveSpeed">键盘移动速度</label>
                    <div class="range-row">
                        <input type="range" id="keyboardMoveSpeed" min="0" max="10" step="0.1" value="2">
                        <input type="number" id="keyboardMoveSpeedValue" min="0" max="10" step="0.1" value="2">
                    </div>
                    <label for="verticalMoveSpeed">上下移动速度</label>
                    <div class="range-row">
                        <input type="range" id="verticalMoveSpeed" min="0" max="10" step="0.1" value="2">
                        <input type="number" id="verticalMoveSpeedValue" min="0" max="10" step="0.1" value="2">
                    </div>
                    <label for="jumpSpeed">跳跃速度</label>
                    <div class="range-row">
                        <input type="range" id="jumpSpeed" min="0" max="20" step="0.2" value="6">
                        <input type="number" id="jumpSpeedValue" min="0" max="20" step="0.2" value="6">
                    </div>
                </div>
            </div>
            <div class="collapsible sub open">光照</div>
            <div id="lightControls" class="collapsible-content">
                <div class="control-group">
                    <label for="dirLightIntensity">方向光强度</label>
                    <div class="range-row">
                        <input type="range" id="dirLightIntensity" min="0" max="5" step="0.05" value="0.8">
                        <input type="number" id="dirLightIntensityValue" min="0" max="5" step="0.05" value="0.8">
                    </div>
                    <label for="dirLightX">方向 X</label>
                    <div class="range-row">
                        <input type="range" id="dirLightX" min="-1" max="1" step="0.01" value="-1">
                        <input type="number" id="dirLightXValue" min="-1" max="1" step="0.01" value="-1">
                    </div>
                    <label for="dirLightY">方向 Y</label>
                    <div class="range-row">
                        <input type="range" id="dirLightY" min="-1" max="1" step="0.01" value="-2">
                        <input type="number" id="dirLightYValue" min="-1" max="1" step="0.01" value="-2">
                    </div>
                    <label for="dirLightZ">方向 Z</label>
                    <div class="range-row">
                        <input type="range" id="dirLightZ" min="-1" max="1" step="0.01" value="-1">
                        <input type="number" id="dirLightZValue" min="-1" max="1" step="0.01" value="-1">
                    </div>
                    <label for="dirLightColor">方向光颜色</label>
                    <input type="color" id="dirLightColor" value="#ffffff">
                    <label for="dirLightOpacity">方向光透明度</label>
                    <div class="range-row">
                        <input type="range" id="dirLightOpacity" min="0" max="1" step="0.01" value="1">
                        <input type="number" id="dirLightOpacityValue" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
            </div>

            <div class="collapsible sub">阴影</div>
            <div id="shadowControls" class="collapsible-content">
                <div class="control-group">
                    <label for="shadowFilter">阴影模式</label>
                    <select id="shadowFilter">
                        <option value="none">None</option>
                        <option value="pcf" selected>PCF</option>
                        <option value="pcss">PCSS</option>
                        <option value="blurbox">Blur Box</option>
                        <option value="blurexp">Blur Exponential</option>
                    </select>
                    <label for="shadowDarkness">阴影强度</label>
                    <div class="range-row">
                        <input type="range" id="shadowDarkness" min="0" max="1" step="0.01" value="0.2">
                        <input type="number" id="shadowDarknessValue" min="0" max="1" step="0.01" value="0.2">
                    </div>
                    <label for="shadowBias">Shadow Bias</label>
                    <div class="range-row">
                        <input type="range" id="shadowBias" min="0" max="0.01" step="0.0001" value="0.001">
                        <input type="number" id="shadowBiasValue" min="0" max="0.01" step="0.0001" value="0.001">
                    </div>
                    <label for="shadowNormalBias">Normal Bias</label>
                    <div class="range-row">
                        <input type="range" id="shadowNormalBias" min="0" max="1" step="0.01" value="0.2">
                        <input type="number" id="shadowNormalBiasValue" min="0" max="1" step="0.01" value="0.2">
                    </div>
                    <label for="shadowBlurKernel">Blur Kernel</label>
                    <div class="range-row">
                        <input type="range" id="shadowBlurKernel" min="1" max="64" step="1" value="16">
                        <input type="number" id="shadowBlurKernelValue" min="1" max="64" step="1" value="16">
                    </div>
                </div>
            </div>

            <div class="collapsible sub open">环境</div>
            <div id="environmentControls" class="collapsible-content">
                <div class="control-group">
                    <label for="envMode">环境样式</label>
                    <select id="envMode">
                        <option value="solid">纯色</option>
                        <option value="procedural">Procedural Sky</option>
                        <option value="hdr" selected>HDR 贴图</option>
                    </select>
                </div>
                <div id="solidControls" class="control-group">
                    <label for="solidColor">纯色颜色</label>
                    <input type="color" id="solidColor" value="#000000">
                    <label for="solidOpacity">透明度</label>
                    <div class="range-row">
                        <input type="range" id="solidOpacity" min="0" max="1" step="0.01" value="1">
                        <input type="number" id="solidOpacityValue" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
                <div id="proceduralControls" class="control-group" style="display: none;">
                    <label for="skyLuminance">天空亮度</label>
                    <div class="range-row">
                        <input type="range" id="skyLuminance" min="0" max="2" step="0.01" value="1">
                        <input type="number" id="skyLuminanceValue" min="0" max="2" step="0.01" value="1">
                    </div>
                    <label for="skyTurbidity">浑浊度</label>
                    <div class="range-row">
                        <input type="range" id="skyTurbidity" min="0" max="50" step="0.5" value="10">
                        <input type="number" id="skyTurbidityValue" min="0" max="50" step="0.5" value="10">
                    </div>
                    <label for="skyRayleigh">瑞利散射</label>
                    <div class="range-row">
                        <input type="range" id="skyRayleigh" min="0" max="4" step="0.01" value="2">
                        <input type="number" id="skyRayleighValue" min="0" max="4" step="0.01" value="2">
                    </div>
                    <label for="skyMieCoefficient">米氏系数</label>
                    <div class="range-row">
                        <input type="range" id="skyMieCoefficient" min="0" max="0.01" step="0.0001" value="0.005">
                        <input type="number" id="skyMieCoefficientValue" min="0" max="0.01" step="0.0001" value="0.005">
                    </div>
                    <label for="skyMieDirectionalG">米氏方向性</label>
                    <div class="range-row">
                        <input type="range" id="skyMieDirectionalG" min="0" max="1" step="0.01" value="0.8">
                        <input type="number" id="skyMieDirectionalGValue" min="0" max="1" step="0.01" value="0.8">
                    </div>
                </div>

                <div class="collapsible sub" id="hdrSectionHeader">HDR 贴图</div>
                <div id="hdrControls" class="collapsible-content">
                    <div class="control-group">
                        <label>
                            启用 HDR 贴图
                            <input type="checkbox" id="hdrEnable" checked style="margin-left: 6px;">
                        </label>
                        <label for="hdrSelect">HDR 贴图</label>
                        <select id="hdrSelect">
                            <option value="A">A.hdr</option>
                            <option value="B" selected>B.hdr</option>
                            <option value="C">C.hdr</option>
                            <option value="D">D.hdr</option>
                        </select>
                        <label>
                            显示天空盒
                            <input type="checkbox" id="hdrShowSkybox" style="margin-left: 6px;">
                        </label>
                        <label>
                            HDR 旋转
                            <input type="checkbox" id="hdrRotation" checked style="margin-left: 6px;">
                        </label>
                        <label for="hdrRotationSpeed">旋转速度</label>
                        <div class="range-row">
                            <input type="range" id="hdrRotationSpeed" min="0" max="0.01" step="0.0001" value="0.0002">
                            <input type="number" id="hdrRotationSpeedValue" min="0" max="0.01" step="0.0001" value="0.0002">
                        </div>
                    </div>
                </div>

                <div class="collapsible sub">背景层</div>
                <div id="backgroundLayerControls" class="collapsible-content">
                    <div class="control-group">
                        <label>
                            启用背景层
                            <input type="checkbox" id="backgroundLayerEnable" style="margin-left: 6px;">
                        </label>
                        <label for="backgroundLayerColor">背景颜色</label>
                        <input type="color" id="backgroundLayerColor" value="#1a1a1a">
                        <label for="backgroundLayerOpacity">透明度</label>
                        <div class="range-row">
                            <input type="range" id="backgroundLayerOpacity" min="0" max="1" step="0.01" value="1">
                            <input type="number" id="backgroundLayerOpacityValue" min="0" max="1" step="0.01" value="1">
                        </div>
                    </div>
                </div>

                <div class="collapsible sub">格线圆盘地面</div>
                <div id="groundControls" class="collapsible-content">
                    <div class="control-group">
                        <label>
                            启用格线圆盘地面
                            <input type="checkbox" id="gridGroundToggle" checked style="margin-left: 6px;">
                        </label>
                        <label for="gridGroundRadius">消隐半径</label>
                        <div class="range-row">
                            <input type="range" id="gridGroundRadius" min="1" max="100" step="1" value="40">
                            <input type="number" id="gridGroundRadiusValue" min="1" max="100" step="1" value="40">
                        </div>
                        <label for="gridFadeWidth">过渡宽度</label>
                        <div class="range-row">

                        <input type="range" id="exposure" min="0" max="2" step="0.01" value="1">
                        <input type="number" id="exposureValue" min="0" max="2" step="0.01" value="1">
                    </div>
                    <label for="contrast">对比度</label>

                        <input type="range" id="contrast" min="0" max="2" step="0.01" value="1">

    </div>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const loadingBarContainer = document.getElementById("loadingBarContainer");
        const loadingPercent = document.getElementById("loadingPercent");

        const hideLoadingBar = () => {
            loadingBarContainer.style.display = "none";
        };

        const infoPanel = document.getElementById("infoPanel");
        const togglePanelButton = document.getElementById("togglePanelButton");
        const toggleLeftPanelButton = document.getElementById("toggleLeftPanelButton");
        const materialPanel = document.getElementById("materialPanel");
        const materialDetailHeader = document.getElementById("materialDetailHeader");
        const materialProperties = document.getElementById("materialProperties");

        const CONFIG_STORAGE_KEY = "k3-ui-config-v1";
        const MATERIAL_CONFIG_KEY = "k3-material-config-v1";
        const DEFAULT_UI_CONFIG_KEY = "k3-ui-default-v1";
        const DEFAULT_MATERIAL_CONFIG_KEY = "k3-material-default-v1";

        const readStorageJson = (key) => {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                console.warn("配置读取失败", error);
                return null;
            }
        };

        const writeStorageJson = (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (error) {
                console.warn("配置保存失败", error);
            }
        };

        const CONFIG_SERVER_BASE = `${window.location.origin}/api/config`;
        const FALLBACK_CONFIG_SERVER_BASE = "http://localhost:3000/api/config";
        let serverConfigAvailable = false;

        const requestConfig = async (base, type, options = {}) => {
            const res = await fetch(`${base}/${type}`, options);
            if (!res.ok) return null;
            return res;
        };

        const loadServerConfig = async (type) => {
            try {
                const res = await requestConfig(CONFIG_SERVER_BASE, type, { cache: "no-store" });
                if (res) {
                    const data = await res.json();
                    serverConfigAvailable = true;
                    return data;
                }
            } catch (error) {
                // ignore
            }
            try {
                const res = await requestConfig(FALLBACK_CONFIG_SERVER_BASE, type, { cache: "no-store" });
                if (!res) return null;
                const data = await res.json();
                serverConfigAvailable = true;
                return data;
            } catch (error) {
                return null;
            }
        };

        const saveServerConfig = async (type, data) => {
            const options = {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            };
            try {
                const res = await requestConfig(CONFIG_SERVER_BASE, type, options);
                if (res) {
                    serverConfigAvailable = true;
                    return true;
                }
            } catch (error) {
                // ignore
            }
            try {
                const res = await requestConfig(FALLBACK_CONFIG_SERVER_BASE, type, options);
                if (res) {
                    serverConfigAvailable = true;
                    return true;
                }
                return false;
            } catch (error) {
                return false;
            }
        };

        // 材质配置保存/加载
        const mergeMaterialConfigs = (baseConfig, overrideConfig) => {
            const merged = { ...(baseConfig || {}) };
            if (!overrideConfig || typeof overrideConfig !== "object") {
                return merged;
            }
            Object.entries(overrideConfig).forEach(([materialName, properties]) => {
                merged[materialName] = {
                    ...(merged[materialName] || {}),
                    ...(properties || {})
                };
            });
            return merged;
        };

        const getDefaultMaterialConfig = () => {
            const storedDefault = readStorageJson(DEFAULT_MATERIAL_CONFIG_KEY);
            if (storedDefault) {
                return storedDefault;
            }
            const saved = readStorageJson(MATERIAL_CONFIG_KEY);
            if (saved && typeof saved === "object") {
                writeStorageJson(DEFAULT_MATERIAL_CONFIG_KEY, saved);
                return saved;
            }
            return {};
        };

        const saveMaterialConfig = (materialName, propertyName, value) => {
            const config = readStorageJson(MATERIAL_CONFIG_KEY) || {};
            if (!config[materialName]) config[materialName] = {};
            config[materialName][propertyName] = value;
            writeStorageJson(MATERIAL_CONFIG_KEY, config);
            writeStorageJson(DEFAULT_MATERIAL_CONFIG_KEY, config);
            saveServerConfig("material", config);
        };

        const loadMaterialConfig = () => {
            const defaultConfig = getDefaultMaterialConfig();
            const savedConfig = readStorageJson(MATERIAL_CONFIG_KEY) || {};
            return mergeMaterialConfigs(defaultConfig, savedConfig);
        };

        const applyMaterialConfig = (material, config) => {
            if (!config) return;
            
            if (config.albedoColor) {
                material.albedoColor = BABYLON.Color3.FromHexString(config.albedoColor);
            }
            if (config.metallic !== undefined) material.metallic = config.metallic;
            if (config.roughness !== undefined) material.roughness = config.roughness;
            if (config.emissiveColor) {
                material.emissiveColor = BABYLON.Color3.FromHexString(config.emissiveColor);
            }
            if (config.emissiveIntensity !== undefined) material.emissiveIntensity = config.emissiveIntensity;
            if (config.alpha !== undefined) material.alpha = config.alpha;
            if (config.bumpLevel !== undefined && material.bumpTexture) {
                material.bumpTexture.level = config.bumpLevel;
            }
            if (config.invertNormalMapX !== undefined) material.invertNormalMapX = config.invertNormalMapX;
            if (config.invertNormalMapY !== undefined) material.invertNormalMapY = config.invertNormalMapY;
            if (config.reflectivityColor) {
                material.reflectivityColor = BABYLON.Color3.FromHexString(config.reflectivityColor);
            }
            if (config.ambientColor) {
                material.ambientColor = BABYLON.Color3.FromHexString(config.ambientColor);
            }
            // clearCoat
            if (config.clearCoatEnabled !== undefined && material.clearCoat) {
                material.clearCoat.isEnabled = config.clearCoatEnabled;
            }
            if (config.clearCoatIntensity !== undefined && material.clearCoat) {
                material.clearCoat.intensity = config.clearCoatIntensity;
            }
            if (config.clearCoatRoughness !== undefined && material.clearCoat) {
                material.clearCoat.roughness = config.clearCoatRoughness;
            }
            // subSurface
            if (config.refractionEnabled !== undefined && material.subSurface) {
                material.subSurface.isRefractionEnabled = config.refractionEnabled;
            }
            if (config.indexOfRefraction !== undefined && material.subSurface) {
                material.subSurface.indexOfRefraction = config.indexOfRefraction;
            }
            if (config.translucencyEnabled !== undefined && material.subSurface) {
                material.subSurface.isTranslucencyEnabled = config.translucencyEnabled;
            }
            if (config.translucencyIntensity !== undefined && material.subSurface) {
                material.subSurface.translucencyIntensity = config.translucencyIntensity;
            }
            // sheen
            if (config.sheenEnabled !== undefined && material.sheen) {
                material.sheen.isEnabled = config.sheenEnabled;
            }
            if (config.sheenIntensity !== undefined && material.sheen) {
                material.sheen.intensity = config.sheenIntensity;
            }
            if (config.sheenColor && material.sheen) {
                material.sheen.color = BABYLON.Color3.FromHexString(config.sheenColor);
            }
            // anisotropy
            if (config.anisotropyEnabled !== undefined && material.anisotropy) {
                material.anisotropy.isEnabled = config.anisotropyEnabled;
            }
            // transparencyMode
            if (config.transparencyMode !== undefined) {
                material.transparencyMode = config.transparencyMode;
                material.markAsDirty(BABYLON.Material.MiscDirtyFlag);
            }
        };

        const getConfigFromUI = () => {
            const inputIds = [
                "envMode", "solidColor", "solidOpacity",
                "skyLuminance", "skyTurbidity", "skyRayleigh", "skyMieCoefficient", "skyMieDirectionalG",
                "hdrEnable", "hdrSelect", "hdrShowSkybox", "hdrRotation", "hdrRotationSpeed",
                "backgroundLayerEnable", "backgroundLayerColor", "backgroundLayerOpacity",
                "gridGroundToggle", "gridGroundRadius", "gridGroundScale", "gridSpacing",
                "gridLineThickness", "gridLineColor", "gridLineOpacity", "gridBaseColor", "gridBaseOpacity",
                "dirLightIntensity", "dirLightX", "dirLightY", "dirLightZ", "dirLightColor", "dirLightOpacity",
                "fxaaToggle", "ssaoToggle", "gyroToggle", "renderScale", "exposure", "contrast",
                "shadowFilter", "shadowDarkness", "shadowBias", "shadowNormalBias", "shadowBlurKernel",
                "mouseSensitivity", "keyboardMoveSpeed", "verticalMoveSpeed", "jumpSpeed"
            ];

            const values = {};
            inputIds.forEach((id) => {
                const el = document.getElementById(id);
                if (!el) return;
                values[id] = el.type === "checkbox" ? el.checked : el.value;
            });

            values.infoPanelHidden = infoPanel.classList.contains("hidden");
            values.leftPanelVisible = materialPanel.classList.contains("visible");
            return values;
        };

        const mergeUiConfig = (baseConfig, overrideConfig) => {
            return { ...(baseConfig || {}), ...(overrideConfig || {}) };
        };

        const getDefaultUiConfig = () => {
            const baseDefaults = getConfigFromUI();
            const storedDefault = readStorageJson(DEFAULT_UI_CONFIG_KEY);
            if (storedDefault) {
                return mergeUiConfig(baseDefaults, storedDefault);
            }
            const saved = readStorageJson(CONFIG_STORAGE_KEY);
            if (saved && typeof saved === "object") {
                const merged = mergeUiConfig(baseDefaults, saved);
                writeStorageJson(DEFAULT_UI_CONFIG_KEY, merged);
                return merged;
            }
            return baseDefaults;
        };

        const applyConfigToUI = (config) => {
            if (!config || typeof config !== "object") return;
            
            Object.entries(config).forEach(([id, value]) => {
                if (id === "infoPanelHidden") return;
                const el = document.getElementById(id);
                if (!el) return;
                
                if (el.type === "checkbox") {
                    el.checked = Boolean(value);
                } else if (value !== undefined && value !== null) {
                    el.value = value;
                }
            });

            if (typeof config.infoPanelHidden === "boolean") {
                if (config.infoPanelHidden) {
                    infoPanel.classList.add("hidden");
                    togglePanelButton.classList.add("hidden");
                } else {
                    infoPanel.classList.remove("hidden");
                    togglePanelButton.classList.remove("hidden");
                }
            }
            
            if (typeof config.leftPanelVisible === "boolean") {
                if (config.leftPanelVisible) {
                    materialPanel.classList.add("visible");
                    toggleLeftPanelButton.classList.add("panel-visible");
                } else {
                    materialPanel.classList.remove("visible");
                    toggleLeftPanelButton.classList.remove("panel-visible");
                }
            }
        };

        const saveConfig = () => {
            const config = getConfigFromUI();
            writeStorageJson(CONFIG_STORAGE_KEY, config);
            writeStorageJson(DEFAULT_UI_CONFIG_KEY, config);
            saveServerConfig("ui", config);
        };

        const scheduleSaveConfig = (() => {
            let timer = null;
            return () => {
                if (timer) clearTimeout(timer);
                timer = setTimeout(saveConfig, 200);
            };
        })();

        const loadConfig = () => {
            const defaults = getDefaultUiConfig();
            const saved = readStorageJson(CONFIG_STORAGE_KEY);
            return mergeUiConfig(defaults, saved || {});
        };

        togglePanelButton.addEventListener("click", () => {
            const isHidden = infoPanel.classList.toggle("hidden");
            togglePanelButton.classList.toggle("hidden");
            scheduleSaveConfig();
        });

        // 左侧面板折叠按钮
        toggleLeftPanelButton.addEventListener("click", () => {
            const isVisible = materialPanel.classList.toggle("visible");
            toggleLeftPanelButton.classList.toggle("panel-visible");
            scheduleSaveConfig();
        });

        // 材质复位/保存按钮 - 稍后在材质加载后绑定
        let resetMaterialButton = null;
        let saveModelButton = null;

        document.querySelectorAll(".collapsible").forEach(collapsible => {
            collapsible.addEventListener("click", () => {
                collapsible.classList.toggle("open");
            });
        });

        const envModeSelect = document.getElementById("envMode");
        const solidControls = document.getElementById("solidControls");
        const proceduralControls = document.getElementById("proceduralControls");
        const hdrControls = document.getElementById("hdrControls");
        const hdrSectionHeader = document.getElementById("hdrSectionHeader");
        const solidColorInput = document.getElementById("solidColor");
        const solidOpacityInput = document.getElementById("solidOpacity");
        const solidOpacityValue = document.getElementById("solidOpacityValue");
        const hdrEnableToggle = document.getElementById("hdrEnable");
        const hdrSelect = document.getElementById("hdrSelect");
        const hdrShowSkyboxToggle = document.getElementById("hdrShowSkybox");
        const hdrRotationToggle = document.getElementById("hdrRotation");
        const hdrRotationSpeedInput = document.getElementById("hdrRotationSpeed");
        const hdrRotationSpeedValue = document.getElementById("hdrRotationSpeedValue");
        const skyLuminanceValue = document.getElementById("skyLuminanceValue");
        const skyTurbidityValue = document.getElementById("skyTurbidityValue");
        const skyRayleighValue = document.getElementById("skyRayleighValue");
        const skyMieCoefficientValue = document.getElementById("skyMieCoefficientValue");
        const skyMieDirectionalGValue = document.getElementById("skyMieDirectionalGValue");

        const backgroundLayerEnable = document.getElementById("backgroundLayerEnable");
        const backgroundLayerColor = document.getElementById("backgroundLayerColor");
        const backgroundLayerOpacity = document.getElementById("backgroundLayerOpacity");
        const backgroundLayerOpacityValue = document.getElementById("backgroundLayerOpacityValue");

        const gridGroundToggle = document.getElementById("gridGroundToggle");
        const gridGroundRadiusInput = document.getElementById("gridGroundRadius");
        const gridGroundRadiusValue = document.getElementById("gridGroundRadiusValue");
        const gridFadeWidthInput = document.getElementById("gridFadeWidth");
        const gridFadeWidthValue = document.getElementById("gridFadeWidthValue");
        const gridGroundScaleInput = document.getElementById("gridGroundScale");
        const gridGroundScaleValue = document.getElementById("gridGroundScaleValue");
        const gridSpacingInput = document.getElementById("gridSpacing");
        const gridSpacingValue = document.getElementById("gridSpacingValue");
        const gridLineThicknessInput = document.getElementById("gridLineThickness");
        const gridLineThicknessValue = document.getElementById("gridLineThicknessValue");
        const gridLineColorInput = document.getElementById("gridLineColor");
        const gridLineOpacityInput = document.getElementById("gridLineOpacity");
        const gridLineOpacityValue = document.getElementById("gridLineOpacityValue");
        const gridBaseColorInput = document.getElementById("gridBaseColor");
        const gridBaseOpacityInput = document.getElementById("gridBaseOpacity");
        const gridBaseOpacityValue = document.getElementById("gridBaseOpacityValue");

        const skyLuminanceInput = document.getElementById("skyLuminance");
        const skyTurbidityInput = document.getElementById("skyTurbidity");
        const skyRayleighInput = document.getElementById("skyRayleigh");
        const skyMieCoefficientInput = document.getElementById("skyMieCoefficient");
        const skyMieDirectionalGInput = document.getElementById("skyMieDirectionalG");

        const dirLightIntensityInput = document.getElementById("dirLightIntensity");
        const dirLightXInput = document.getElementById("dirLightX");
        const dirLightXValue = document.getElementById("dirLightXValue");
        const dirLightYInput = document.getElementById("dirLightY");
        const dirLightYValue = document.getElementById("dirLightYValue");
        const dirLightZInput = document.getElementById("dirLightZ");
        const dirLightZValue = document.getElementById("dirLightZValue");
        const dirLightColorInput = document.getElementById("dirLightColor");
        const dirLightOpacityInput = document.getElementById("dirLightOpacity");
        const dirLightIntensityValue = document.getElementById("dirLightIntensityValue");
        const dirLightOpacityValue = document.getElementById("dirLightOpacityValue");

        const fxaaToggle = document.getElementById("fxaaToggle");
        const ssaoToggle = document.getElementById("ssaoToggle");
        const gyroToggle = document.getElementById("gyroToggle");
        const renderScaleInput = document.getElementById("renderScale");
        const renderScaleValue = document.getElementById("renderScaleValue");
        const exposureInput = document.getElementById("exposure");
        const exposureValue = document.getElementById("exposureValue");
        const contrastInput = document.getElementById("contrast");
        const contrastValue = document.getElementById("contrastValue");
        const shadowFilterSelect = document.getElementById("shadowFilter");
        const shadowDarknessInput = document.getElementById("shadowDarkness");
        const shadowDarknessValue = document.getElementById("shadowDarknessValue");
        const shadowBiasInput = document.getElementById("shadowBias");
        const shadowBiasValue = document.getElementById("shadowBiasValue");
        const shadowNormalBiasInput = document.getElementById("shadowNormalBias");
        const shadowNormalBiasValue = document.getElementById("shadowNormalBiasValue");
        const shadowBlurKernelInput = document.getElementById("shadowBlurKernel");
        const shadowBlurKernelValue = document.getElementById("shadowBlurKernelValue");

        const resetCameraButton = document.getElementById("resetCameraButton");
        const mouseSensitivityInput = document.getElementById("mouseSensitivity");
        const mouseSensitivityValue = document.getElementById("mouseSensitivityValue");
        const keyboardMoveSpeedInput = document.getElementById("keyboardMoveSpeed");
        const keyboardMoveSpeedValue = document.getElementById("keyboardMoveSpeedValue");
        const verticalMoveSpeedInput = document.getElementById("verticalMoveSpeed");
        const verticalMoveSpeedValue = document.getElementById("verticalMoveSpeedValue");
        const jumpSpeedInput = document.getElementById("jumpSpeed");
        const jumpSpeedValue = document.getElementById("jumpSpeedValue");

        const updateEnvironmentUI = () => {
            const mode = envModeSelect.value;
            solidControls.style.display = mode === "solid" ? "block" : "none";
            proceduralControls.style.display = mode === "procedural" ? "block" : "none";
            hdrControls.style.display = mode === "hdr" ? "block" : "none";
            hdrSectionHeader.style.display = mode === "hdr" ? "flex" : "none";
        };

        const linkRangeNumber = (rangeEl, numberEl) => {
            if (!rangeEl || !numberEl) {
                return;
            }
            // 移除数字输入的min/max限制，允许突破范围
            numberEl.removeAttribute('min');
            numberEl.removeAttribute('max');
            
            const syncFromRange = () => {
                numberEl.value = rangeEl.value;
            };

            const syncFromNumber = () => {
                const step = parseFloat(rangeEl.step) || 1;
                let num = parseFloat(numberEl.value);
                if (Number.isNaN(num)) {
                    num = parseFloat(rangeEl.value);
                }
                // 对滑块范围内的值进行同步
                const min = parseFloat(rangeEl.min);
                const max = parseFloat(rangeEl.max);
                const clampedForSlider = Math.min(max, Math.max(min, num));
                rangeEl.value = clampedForSlider;
                // 但数字输入保持用户输入的值
                numberEl.value = num;
                rangeEl.dispatchEvent(new Event("input"));
            };

            rangeEl.addEventListener("input", syncFromRange);
            numberEl.addEventListener("input", syncFromNumber);
            numberEl.addEventListener("change", syncFromNumber);

            syncFromRange();
        };

        updateEnvironmentUI();

        linkRangeNumber(solidOpacityInput, solidOpacityValue);
        linkRangeNumber(skyLuminanceInput, skyLuminanceValue);
        linkRangeNumber(skyTurbidityInput, skyTurbidityValue);
        linkRangeNumber(skyRayleighInput, skyRayleighValue);
        linkRangeNumber(skyMieCoefficientInput, skyMieCoefficientValue);
        linkRangeNumber(skyMieDirectionalGInput, skyMieDirectionalGValue);
        linkRangeNumber(hdrRotationSpeedInput, hdrRotationSpeedValue);
        linkRangeNumber(backgroundLayerOpacity, backgroundLayerOpacityValue);

        linkRangeNumber(gridGroundRadiusInput, gridGroundRadiusValue);
        linkRangeNumber(gridFadeWidthInput, gridFadeWidthValue);
        linkRangeNumber(gridGroundScaleInput, gridGroundScaleValue);
        linkRangeNumber(gridSpacingInput, gridSpacingValue);
        linkRangeNumber(gridLineThicknessInput, gridLineThicknessValue);
        linkRangeNumber(gridLineOpacityInput, gridLineOpacityValue);
        linkRangeNumber(gridBaseOpacityInput, gridBaseOpacityValue);

        linkRangeNumber(dirLightIntensityInput, dirLightIntensityValue);
        linkRangeNumber(dirLightXInput, dirLightXValue);
        linkRangeNumber(dirLightYInput, dirLightYValue);
        linkRangeNumber(dirLightZInput, dirLightZValue);
        linkRangeNumber(dirLightOpacityInput, dirLightOpacityValue);

        linkRangeNumber(renderScaleInput, renderScaleValue);
        linkRangeNumber(exposureInput, exposureValue);
        linkRangeNumber(contrastInput, contrastValue);

        linkRangeNumber(shadowDarknessInput, shadowDarknessValue);
        linkRangeNumber(shadowBiasInput, shadowBiasValue);
        linkRangeNumber(shadowNormalBiasInput, shadowNormalBiasValue);
        linkRangeNumber(shadowBlurKernelInput, shadowBlurKernelValue);

        linkRangeNumber(mouseSensitivityInput, mouseSensitivityValue);
        linkRangeNumber(keyboardMoveSpeedInput, keyboardMoveSpeedValue);
        linkRangeNumber(verticalMoveSpeedInput, verticalMoveSpeedValue);
        linkRangeNumber(jumpSpeedInput, jumpSpeedValue);

        const initConfigFromServer = async () => {
            const [serverUi, serverMaterial] = await Promise.all([
                loadServerConfig("ui"),
                loadServerConfig("material")
            ]);

            if (serverUi && typeof serverUi === "object") {
                writeStorageJson(DEFAULT_UI_CONFIG_KEY, serverUi);
            }
            if (serverMaterial && typeof serverMaterial === "object") {
                writeStorageJson(DEFAULT_MATERIAL_CONFIG_KEY, serverMaterial);
            }

            const initialConfig = loadConfig();
            applyConfigToUI(initialConfig);
            updateEnvironmentUI();
            writeStorageJson(DEFAULT_UI_CONFIG_KEY, getConfigFromUI());
        };

        // 应用保存的配置（优先服务端配置文件）
        initConfigFromServer();

        // 为所有配置项添加自动保存监听器
        [
            "envMode", "solidColor", "solidOpacity",
            "skyLuminance", "skyTurbidity", "skyRayleigh", "skyMieCoefficient", "skyMieDirectionalG",
            "hdrEnable", "hdrSelect", "hdrShowSkybox", "hdrRotation", "hdrRotationSpeed",
            "backgroundLayerEnable", "backgroundLayerColor", "backgroundLayerOpacity",
            "gridGroundToggle", "gridGroundRadius", "gridGroundScale", "gridSpacing",
            "gridLineThickness", "gridLineColor", "gridLineOpacity", "gridBaseColor", "gridBaseOpacity",
            "dirLightIntensity", "dirLightX", "dirLightY", "dirLightZ", "dirLightColor", "dirLightOpacity",
            "fxaaToggle", "ssaoToggle", "gyroToggle", "renderScale", "exposure", "contrast",
            "shadowFilter", "shadowDarkness", "shadowBias", "shadowNormalBias", "shadowBlurKernel",
            "mouseSensitivity", "keyboardMoveSpeed", "verticalMoveSpeed", "jumpSpeed"
        ].forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            const eventName = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
            el.addEventListener(eventName, scheduleSaveConfig);
        });

        let scene = null;
        let renderLoopStarted = false;
        const startRenderLoop = () => {
            if (renderLoopStarted || !scene) return;
            renderLoopStarted = true;
            engine.runRenderLoop(() => scene.render());
        };

        const createScene = () => {
            const scene = new BABYLON.Scene(engine);

            // 设置场景背景为黑色
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

            const hdrFiles = {
                A: "env/A.hdr",
                B: "env/B.hdr",
                C: "env/C.hdr",
                D: "env/D.hdr"
            };

            let currentHdrTexture = null;
            let currentSkybox = null;
            let currentSkyMaterial = null;
            let hdrRotationEnabled = hdrRotationToggle.checked;
            let hdrRotationSpeed = parseFloat(hdrRotationSpeedInput.value);
            let showHdrSkybox = hdrShowSkyboxToggle.checked;
            let hdrEnabled = hdrEnableToggle.checked;

            const gridMeshRadius = 100;
            let gridGround = null;
            let gridGroundMaterial = null;
            let gridGroundTexture = null;
            let modelMinY = null;

            const disposeEnvironment = () => {
                if (currentSkybox) {
                    currentSkybox.dispose();
                    currentSkybox = null;
                }
                if (currentSkyMaterial) {
                    currentSkyMaterial.dispose();
                    currentSkyMaterial = null;
                }
                if (currentHdrTexture) {
                    currentHdrTexture.dispose();
                    currentHdrTexture = null;
                }
            };

            const ensureGridGround = () => {
                if (!gridGround) {
                    gridGround = BABYLON.MeshBuilder.CreateDisc("gridGround", { radius: gridMeshRadius, tessellation: 128 }, scene);
                    gridGround.rotation.x = Math.PI / 2;
                    gridGround.isPickable = false;
                    gridGround.receiveShadows = true;
                    gridGround.setPivotPoint(BABYLON.Vector3.Zero());

                    gridGroundMaterial = new BABYLON.StandardMaterial("gridGroundMat", scene);
                    gridGroundMaterial.backFaceCulling = false;
                    gridGroundMaterial.specularColor = new BABYLON.Color3(0, 0, 0);

                    gridGroundTexture = new BABYLON.DynamicTexture("gridGroundTex", { width: 2048, height: 2048 }, scene, false);
                    gridGroundTexture.hasAlpha = true;
                    gridGroundTexture.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
                    gridGroundTexture.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
                    gridGroundTexture.anisotropicFilteringLevel = 16;
                    gridGroundTexture.updateSamplingMode(BABYLON.Texture.NEAREST_SAMPLINGMODE);

                    gridGroundMaterial.diffuseTexture = gridGroundTexture;
                    gridGroundMaterial.opacityTexture = gridGroundTexture;
                    gridGroundMaterial.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
                    gridGround.material = gridGroundMaterial;
                }
            };

            const redrawGridTexture = () => {
                if (!gridGroundTexture) {
                    return;
                }
                const ctx = gridGroundTexture.getContext();
                const size = 2048;
                // 防御：避免 spacing 为 0/NaN 导致死循环或浏览器卡死
                const spacing = Math.max(1, Math.floor(parseFloat(gridSpacingInput.value) || 0));
                const lineWidth = Math.max(0.5, parseFloat(gridLineThicknessInput.value) || 0.5);

                const lineColor = BABYLON.Color3.FromHexString(gridLineColorInput.value || "#9a9a9a");
                const baseColor = BABYLON.Color3.FromHexString(gridBaseColorInput.value || "#2b2b2b");
                const lineAlpha = parseFloat(gridLineOpacityInput.value);
                const baseAlpha = parseFloat(gridBaseOpacityInput.value);

                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, size, size);
                ctx.fillStyle = `rgba(${Math.round(baseColor.r * 255)}, ${Math.round(baseColor.g * 255)}, ${Math.round(baseColor.b * 255)}, ${baseAlpha})`;
                ctx.fillRect(0, 0, size, size);

                ctx.strokeStyle = `rgba(${Math.round(lineColor.r * 255)}, ${Math.round(lineColor.g * 255)}, ${Math.round(lineColor.b * 255)}, ${lineAlpha})`;
                ctx.lineWidth = lineWidth;

                // 批量绘制网格线：减少 beginPath/stroke 次数
                ctx.beginPath();
                for (let x = 0; x <= size; x += spacing) {
                    const px = x + 0.5;
                    ctx.moveTo(px, 0);
                    ctx.lineTo(px, size);
                }
                ctx.stroke();

                ctx.beginPath();
                for (let y = 0; y <= size; y += spacing) {
                    const py = y + 0.5;
                    ctx.moveTo(0, py);
                    ctx.lineTo(size, py);
                }
                ctx.stroke();

                ctx.globalCompositeOperation = "destination-in";
                const center = size / 2;
                const maxRadiusPx = size / 2;
                const fadeRadius = Math.max(1, Math.min(gridMeshRadius, parseFloat(gridGroundRadiusInput.value)));
                const fadeRatio = fadeRadius / gridMeshRadius;
                const fadeRadiusPx = maxRadiusPx * fadeRatio;
                const fadeWidth = parseFloat(gridFadeWidthInput.value); // 获取过渡宽度
                const fadeStart = Math.max(0, 1 - fadeWidth); // 计算过渡开始位置
                const gradient = ctx.createRadialGradient(center, center, 0, center, center, fadeRadiusPx);
                gradient.addColorStop(0, "rgba(255,255,255,1)");
                gradient.addColorStop(fadeStart, "rgba(255,255,255,1)");
                gradient.addColorStop(1, "rgba(255,255,255,0)");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                ctx.globalCompositeOperation = "source-over";

                gridGroundTexture.update(false);
            };

            const updateGridGround = () => {
                ensureGridGround();
                const enabled = gridGroundToggle.checked;
                gridGround.setEnabled(enabled);
                if (enabled) {
                    const baseY = modelMinY !== null ? modelMinY : 0;
                    gridGround.position.set(0, baseY, 0);
                    // Radius only controls fade edge; scale controls mesh size
                    const scale = parseFloat(gridGroundScaleInput.value);
                    gridGround.scaling.set(scale, scale, 1);
                    gridGroundTexture.uScale = 1;
                    gridGroundTexture.vScale = 1;
                    gridGround.rotationQuaternion = null;
                    gridGround.rotation.x = Math.PI / 2;
                }
                redrawGridTexture();
            };

            const applyEnvironment = () => {
                const mode = envModeSelect.value;
                disposeEnvironment();

                // 检查是否启用背景层
                const backgroundLayerEnabled = backgroundLayerEnable.checked;

                if (mode === "solid") {
                    scene.environmentTexture = null;
                    const color = BABYLON.Color3.FromHexString(solidColorInput.value || "#000000");
                    const alpha = parseFloat(solidOpacityInput.value);
                    scene.clearColor = new BABYLON.Color4(color.r, color.g, color.b, alpha);
                }

                if (mode === "procedural") {
                    scene.environmentTexture = null;
                    if (!backgroundLayerEnabled) {
                        scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
                        const skybox = BABYLON.MeshBuilder.CreateBox("proceduralSkyBox", { size: 1000 }, scene);
                        const skyMaterial = new BABYLON.SkyMaterial("skyMaterial", scene);
                        skyMaterial.backFaceCulling = false;
                        skyMaterial.disableLighting = true;
                        skyMaterial.luminance = parseFloat(skyLuminanceInput.value);
                        skyMaterial.turbidity = parseFloat(skyTurbidityInput.value);
                        skyMaterial.rayleigh = parseFloat(skyRayleighInput.value);
                        skyMaterial.mieCoefficient = parseFloat(skyMieCoefficientInput.value);
                        skyMaterial.mieDirectionalG = parseFloat(skyMieDirectionalGInput.value);
                        skybox.material = skyMaterial;
                        skybox.infiniteDistance = true;
                        skybox.isPickable = false;
                        currentSkybox = skybox;
                        currentSkyMaterial = skyMaterial;
                    } else {
                        // 应用背景层颜色
                        const bgColor = BABYLON.Color3.FromHexString(backgroundLayerColor.value || "#1a1a1a");
                        const bgAlpha = parseFloat(backgroundLayerOpacity.value);
                        scene.clearColor = new BABYLON.Color4(bgColor.r, bgColor.g, bgColor.b, bgAlpha);
                    }
                }

                if (mode === "hdr") {
                    if (!hdrEnabled) {
                        scene.environmentTexture = null;
                        scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
                        return;
                    }
                    
                    // HDR环境贴图始终加载（用于反射和光照）
                    const hdrTexture = new BABYLON.HDRCubeTexture(hdrFiles[hdrSelect.value], scene, 2048);
                    scene.environmentTexture = hdrTexture;
                    currentHdrTexture = hdrTexture;
                    
                    if (backgroundLayerEnabled) {
                        // 启用背景层时：不显示天空盒，使用背景层颜色
                        const bgColor = BABYLON.Color3.FromHexString(backgroundLayerColor.value || "#1a1a1a");
                        const bgAlpha = parseFloat(backgroundLayerOpacity.value);
                        scene.clearColor = new BABYLON.Color4(bgColor.r, bgColor.g, bgColor.b, bgAlpha);
                    } else {
                        // 未启用背景层时：根据设置决定是否显示天空盒
                        scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
                        if (showHdrSkybox) {
                            currentSkybox = scene.createDefaultSkybox(hdrTexture, true, 1000);
                        }
                    }
                }
            };

            scene.registerBeforeRender(() => {
                if (currentHdrTexture && hdrRotationEnabled && envModeSelect.value === "hdr") {
                    currentHdrTexture.rotationY += hdrRotationSpeed;
                    if (currentSkybox) {
                        currentSkybox.rotation.y = -currentHdrTexture.rotationY;
                    }
                }
            });

            // 检查并调整方向光设置
            const light = new BABYLON.DirectionalLight("light", new BABYLON.Vector3(-1, 2, -1), scene);
            light.intensity = 0.5; // 增强光源强度
            light.position = new BABYLON.Vector3(15, 30, 15); // 提高光源位置

            // 添加日光效果
            const sunLight = new BABYLON.DirectionalLight("sunLight", new BABYLON.Vector3(-1, -2, -1), scene);
            sunLight.intensity = 1; // 设置日光强度
            sunLight.position = new BABYLON.Vector3(50, 100, 50); // 设置日光位置
            sunLight.diffuse = new BABYLON.Color3(1.0, 1, 1); // 模拟日光的暖色调
            sunLight.specular = new BABYLON.Color3(1.0, 1, 1); // 设置高光颜色

            // 额外可调 DirectionalLight
            const uiDirectionalLight = new BABYLON.DirectionalLight("uiDirectionalLight", new BABYLON.Vector3(-1, -2, -1), scene);
            uiDirectionalLight.intensity = parseFloat(dirLightIntensityInput.value);
            uiDirectionalLight.diffuse = BABYLON.Color3.FromHexString(dirLightColorInput.value || "#ffffff");

            // 添加日光阴影
            const sunShadowGenerator = new BABYLON.ShadowGenerator(4096, sunLight);
            sunShadowGenerator.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH; // 设置高质量过滤
            sunShadowGenerator.enableTransparentShadow = true;

            const camera = new BABYLON.ArcRotateCamera("Camera", Math.PI*0, Math.PI/3, 2, BABYLON.Vector3.Zero(), scene);

            
            camera.attachControl(canvas, true);
            camera.minZ = 0; // 设置最近剪切平面为 0
            camera.wheelDeltaPercentage = 0.005; // 设置滚动速率为当前的 1/20
            camera.pinchDeltaPercentage = 0.005; // 设置触摸缩放速率为当前的 1/20

            camera.wheelPrecision = 100; // 适中滚轮缩放精度

            const initialCameraState = {
                alpha: camera.alpha,
                beta: camera.beta,
                radius: camera.radius,
                target: camera.target.clone()
            };

            const movementState = {
                forward: false,
                back: false,
                left: false,
                right: false,
                up: false,
                down: false,
                jump: false
            };

            const isInputFocused = () => {
                const active = document.activeElement;
                return active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT");
            };

            document.addEventListener("keydown", (event) => {
                if (isInputFocused()) {
                    return;
                }
                if (event.code === "KeyW") movementState.forward = true;
                if (event.code === "KeyS") movementState.back = true;
                if (event.code === "KeyA") movementState.left = true;
                if (event.code === "KeyD") movementState.right = true;
                if (event.code === "KeyE") movementState.down = true;
                if (event.code === "KeyQ") movementState.up = true;
                if (event.code === "Space") movementState.jump = true;
            });

            document.addEventListener("keyup", (event) => {
                if (event.code === "KeyW") movementState.forward = false;
                if (event.code === "KeyS") movementState.back = false;
                if (event.code === "KeyA") movementState.left = false;
                if (event.code === "KeyD") movementState.right = false;
                if (event.code === "KeyE") movementState.down = false;
                if (event.code === "KeyQ") movementState.up = false;
                if (event.code === "Space") movementState.jump = false;
            });


            // 开启环境光遮蔽
            const aoRenderer = new BABYLON.SSAORenderingPipeline("ssao", scene, 1);
            aoRenderer.radius = .000001; // 设置遮蔽半径
            aoRenderer.totalStrength = 1; // 设置遮蔽强度
            aoRenderer.area = 1; // 设置遮蔽区域
            aoRenderer.fallOff = 0.000001; // 设置遮蔽衰减
            aoRenderer.base = .1; // 设置遮蔽基础值
            scene.postProcessRenderPipelineManager.attachCamerasToRenderPipeline("ssao", camera);

            // 添加抗锯齿效果
            const fxaaPostProcess = new BABYLON.FxaaPostProcess("fxaa", 1.0, camera);
            fxaaPostProcess.samples = 16; // 设置采样数为 16

            scene.imageProcessingConfiguration.toneMappingEnabled = true;
            scene.imageProcessingConfiguration.exposure = parseFloat(exposureInput.value);
            scene.imageProcessingConfiguration.contrast = parseFloat(contrastInput.value);

            const updateDirectionalLight = () => {
                const direction = new BABYLON.Vector3(
                    parseFloat(dirLightXInput.value),
                    parseFloat(dirLightYInput.value),
                    parseFloat(dirLightZInput.value)
                );
                uiDirectionalLight.direction = direction;
                uiDirectionalLight.intensity = parseFloat(dirLightIntensityInput.value);
                const lightColor = BABYLON.Color3.FromHexString(dirLightColorInput.value || "#ffffff");
                const lightAlpha = parseFloat(dirLightOpacityInput.value);
                uiDirectionalLight.diffuse = lightColor.scale(lightAlpha);
            };

            const updateShadowSettings = () => {
                const mode = shadowFilterSelect.value;
                const blurKernel = parseFloat(shadowBlurKernelInput.value);

                if (mode === "none") {
                    sunShadowGenerator.filter = BABYLON.ShadowGenerator.FILTER_NONE;
                }
                if (mode === "pcf") {
                    sunShadowGenerator.filter = BABYLON.ShadowGenerator.FILTER_PCF;
                }
                if (mode === "pcss") {
                    sunShadowGenerator.filter = BABYLON.ShadowGenerator.FILTER_PCSS;
                    sunShadowGenerator.contactHardeningLightSizeUVRatio = 0.1;
                }
                if (mode === "blurbox") {
                    sunShadowGenerator.filter = BABYLON.ShadowGenerator.FILTER_BLURBOX;
                    sunShadowGenerator.blurKernel = blurKernel;
                }
                if (mode === "blurexp") {
                    sunShadowGenerator.filter = BABYLON.ShadowGenerator.FILTER_BLUREXPONENTIALSHADOWMAP;
                    sunShadowGenerator.blurKernel = blurKernel;
                }

                sunShadowGenerator.bias = parseFloat(shadowBiasInput.value);
                sunShadowGenerator.normalBias = parseFloat(shadowNormalBiasInput.value);
                sunShadowGenerator.darkness = parseFloat(shadowDarknessInput.value);
            };

            const updateRenderSettings = () => {
                fxaaPostProcess.enabled = fxaaToggle.checked;
                if (ssaoToggle.checked) {
                    scene.postProcessRenderPipelineManager.attachCamerasToRenderPipeline("ssao", camera);
                } else {
                    scene.postProcessRenderPipelineManager.detachCamerasFromRenderPipeline("ssao", camera);
                }
                const scale = parseFloat(renderScaleInput.value);
                engine.setHardwareScalingLevel(1 / scale);
                scene.imageProcessingConfiguration.exposure = parseFloat(exposureInput.value);
                scene.imageProcessingConfiguration.contrast = parseFloat(contrastInput.value);
            };

            let keyboardMoveSpeed = parseFloat(keyboardMoveSpeedInput.value);
            let verticalMoveSpeed = parseFloat(verticalMoveSpeedInput.value);
            let jumpSpeed = parseFloat(jumpSpeedInput.value);

            const updateControlSettings = () => {
                const sensitivity = parseFloat(mouseSensitivityInput.value);
                camera.angularSensibilityX = sensitivity;
                camera.angularSensibilityY = sensitivity;
                keyboardMoveSpeed = parseFloat(keyboardMoveSpeedInput.value);
                verticalMoveSpeed = parseFloat(verticalMoveSpeedInput.value);
                jumpSpeed = parseFloat(jumpSpeedInput.value);
            };

            const updateGyroControl = () => {
                if (gyroToggle.checked) {
                    camera.inputs.addDeviceOrientation();
                } else {
                    camera.inputs.removeByType("ArcRotateCameraDeviceOrientationInput");
                }
            };

            // 每帧执行：尽量避免产生临时对象，减少 GC 抖动
            const tmpForward = new BABYLON.Vector3();
            const tmpRight = new BABYLON.Vector3();
            const tmpMove = new BABYLON.Vector3();

            const applyKeyboardMovement = () => {
                const deltaSeconds = engine.getDeltaTime() * 0.001;
                if (deltaSeconds <= 0) return;

                // forward: 相机前向投影到 XZ 平面
                if (typeof camera.getDirectionToRef === "function") {
                    camera.getDirectionToRef(BABYLON.Axis.Z, tmpForward);
                } else {
                    tmpForward.copyFrom(camera.getDirection(BABYLON.Axis.Z));
                }
                tmpForward.y = 0;
                if (tmpForward.lengthSquared() === 0) return;
                tmpForward.normalize();

                BABYLON.Vector3.CrossToRef(BABYLON.Axis.Y, tmpForward, tmpRight);
                if (tmpRight.lengthSquared() === 0) return;
                tmpRight.normalize();

                tmpMove.set(0, 0, 0);
                const planarStep = keyboardMoveSpeed * deltaSeconds;
                const verticalStep = verticalMoveSpeed * deltaSeconds;
                const jumpStep = jumpSpeed * deltaSeconds;

                if (movementState.forward) {
                    tmpMove.x += tmpForward.x * planarStep;
                    tmpMove.z += tmpForward.z * planarStep;
                }
                if (movementState.back) {
                    tmpMove.x -= tmpForward.x * planarStep;
                    tmpMove.z -= tmpForward.z * planarStep;
                }
                if (movementState.left) {
                    tmpMove.x -= tmpRight.x * planarStep;
                    tmpMove.z -= tmpRight.z * planarStep;
                }
                if (movementState.right) {
                    tmpMove.x += tmpRight.x * planarStep;
                    tmpMove.z += tmpRight.z * planarStep;
                }
                if (movementState.up) tmpMove.y += verticalStep;
                if (movementState.down) tmpMove.y -= verticalStep;
                if (movementState.jump) tmpMove.y += jumpStep;

                if (tmpMove.lengthSquared() > 0) {
                    camera.position.addInPlace(tmpMove);
                    camera.target.addInPlace(tmpMove);
                }
            };

            scene.registerBeforeRender(applyKeyboardMovement);

            envModeSelect.addEventListener("change", () => {
                updateEnvironmentUI();
                applyEnvironment();
            });
            solidOpacityInput.addEventListener("input", applyEnvironment);
            hdrEnableToggle.addEventListener("change", (event) => {
                hdrEnabled = event.target.checked;
                applyEnvironment();
            });
            hdrSelect.addEventListener("change", applyEnvironment);
            hdrShowSkyboxToggle.addEventListener("change", (event) => {
                showHdrSkybox = event.target.checked;
                applyEnvironment();
            });
            hdrRotationToggle.addEventListener("change", (event) => {
                hdrRotationEnabled = event.target.checked;
            });
            hdrRotationSpeedInput.addEventListener("input", (event) => {
                hdrRotationSpeed = parseFloat(event.target.value);
            });

            backgroundLayerEnable.addEventListener("change", applyEnvironment);
            // 优化背景层颜色/透明度更改 - 只更新clearColor
            const updateBackgroundLayer = () => {
                const backgroundLayerEnabled = backgroundLayerEnable.checked;
                if (backgroundLayerEnabled) {
                    const bgColor = BABYLON.Color3.FromHexString(backgroundLayerColor.value || "#1a1a1a");
                    const bgAlpha = parseFloat(backgroundLayerOpacity.value);
                    scene.clearColor = new BABYLON.Color4(bgColor.r, bgColor.g, bgColor.b, bgAlpha);
                } else {
                    // 如果背景层未启用，恢复默认
                    if (envModeSelect.value === "hdr" && hdrEnableToggle.checked) {
                        scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
                    }
                }
                scheduleSaveConfig();
            };
            backgroundLayerOpacity.addEventListener("input", updateBackgroundLayer);

            const updateProceduralSky = () => {
                if (currentSkyMaterial) {
                    currentSkyMaterial.luminance = parseFloat(skyLuminanceInput.value);
                    currentSkyMaterial.turbidity = parseFloat(skyTurbidityInput.value);
                    currentSkyMaterial.rayleigh = parseFloat(skyRayleighInput.value);
                    currentSkyMaterial.mieCoefficient = parseFloat(skyMieCoefficientInput.value);
                    currentSkyMaterial.mieDirectionalG = parseFloat(skyMieDirectionalGInput.value);
                }
            };

            skyLuminanceInput.addEventListener("input", updateProceduralSky);
            skyTurbidityInput.addEventListener("input", updateProceduralSky);
            skyRayleighInput.addEventListener("input", updateProceduralSky);
            skyMieCoefficientInput.addEventListener("input", updateProceduralSky);
            skyMieDirectionalGInput.addEventListener("input", updateProceduralSky);

            // 颜色输入事件监听
            dirLightColorInput.addEventListener("input", updateDirectionalLight);
            solidColorInput.addEventListener("input", applyEnvironment);
            backgroundLayerColor.addEventListener("input", updateBackgroundLayer);
            gridLineColorInput.addEventListener("input", updateGridGround);
            gridBaseColorInput.addEventListener("input", updateGridGround);

            dirLightIntensityInput.addEventListener("input", updateDirectionalLight);
            dirLightXInput.addEventListener("input", updateDirectionalLight);
            dirLightYInput.addEventListener("input", updateDirectionalLight);
            dirLightZInput.addEventListener("input", updateDirectionalLight);
            dirLightOpacityInput.addEventListener("input", updateDirectionalLight);

            fxaaToggle.addEventListener("change", updateRenderSettings);
            ssaoToggle.addEventListener("change", updateRenderSettings);
            renderScaleInput.addEventListener("input", updateRenderSettings);
            exposureInput.addEventListener("input", updateRenderSettings);
            contrastInput.addEventListener("input", updateRenderSettings);

            gridGroundToggle.addEventListener("change", updateGridGround);
            gridGroundRadiusInput.addEventListener("input", updateGridGround);
            gridFadeWidthInput.addEventListener("input", updateGridGround);
