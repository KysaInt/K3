            gridGroundScaleInput.addEventListener("input", updateGridGround);
            gridSpacingInput.addEventListener("input", updateGridGround);
            gridLineThicknessInput.addEventListener("input", updateGridGround);
            gridLineOpacityInput.addEventListener("input", updateGridGround);
            gridBaseOpacityInput.addEventListener("input", updateGridGround);

            gyroToggle.addEventListener("change", updateGyroControl);

            resetCameraButton.addEventListener("click", () => {
                camera.alpha = initialCameraState.alpha;
                camera.beta = initialCameraState.beta;
                camera.radius = initialCameraState.radius;
                camera.setTarget(initialCameraState.target.clone());
            });

            mouseSensitivityInput.addEventListener("input", updateControlSettings);
            keyboardMoveSpeedInput.addEventListener("input", updateControlSettings);
            verticalMoveSpeedInput.addEventListener("input", updateControlSettings);
            jumpSpeedInput.addEventListener("input", updateControlSettings);

            shadowFilterSelect.addEventListener("change", updateShadowSettings);
            shadowDarknessInput.addEventListener("input", updateShadowSettings);
            shadowBiasInput.addEventListener("input", updateShadowSettings);
            shadowNormalBiasInput.addEventListener("input", updateShadowSettings);
            shadowBlurKernelInput.addEventListener("input", updateShadowSettings);

            applyEnvironment();
            updateDirectionalLight();
            updateRenderSettings();
            updateGyroControl();
            updateShadowSettings();
            updateControlSettings();
            updateGridGround();

            // 显示加载动画
            loadingBarContainer.style.display = "flex";
            // 让 canvas 在 loading 期间就开始渲染/编译（遮罩盖在上面）
            canvas.style.visibility = "visible";
            if (loadingPercent) loadingPercent.textContent = "Created by Aye";

            // 加载模型
            BABYLON.SceneLoader.LoadAssetContainer(
                "models/", 
                "model.glb", 
                scene, 
                (container) => {
                    console.log("模型加载完成！");
                    container.addAllToScene();
                    
                    startRenderLoop();

                // 设置模型的默认变换
                container.meshes.forEach(mesh => {
                    if (mesh.name !== "__root__") { // 忽略根节点
                        mesh.scaling = new BABYLON.Vector3(8, 8, 8); // 设置缩放
                        mesh.rotation = new BABYLON.Vector3(0, Math.PI / 4, 0); // 设置旋转
                        mesh.position = new BABYLON.Vector3(0, 0, 0); // 设置位移
                        sunShadowGenerator.addShadowCaster(mesh); // 添加阴影投射器
                    }
                });

                const modelMeshes = container.meshes.filter(mesh => mesh.name !== "__root__");
                if (modelMeshes.length > 0) {
                    let minY = Infinity;
                    modelMeshes.forEach(mesh => {
                        const bounds = mesh.getBoundingInfo().boundingBox;
                        minY = Math.min(minY, bounds.minimumWorld.y);
                    });
                    modelMinY = minY;
                    updateGridGround();
                }

                // 保持 UI 功能不变
                const materialList = document.getElementById("materialList");
                materialList.innerHTML = ""; // 清空材质列表

                // 绑定材质复位/保存按钮
                resetMaterialButton = document.getElementById("resetMaterialButton");
                if (resetMaterialButton) {
                    resetMaterialButton.addEventListener("click", () => {
                        // 清除所有保存的材质配置
                        localStorage.removeItem(MATERIAL_CONFIG_KEY);
                        localStorage.removeItem(DEFAULT_MATERIAL_CONFIG_KEY);
                        
                        // 重新加载模型以恢复默认材质
                        alert("材质已复位，即将重新加载模型...");
                        location.reload();
                    });
                }

                saveModelButton = document.getElementById("saveModelButton");
                if (saveModelButton) {
                    saveModelButton.addEventListener("click", async () => {
                        if (!scene || !BABYLON.GLTF2Export) {
                            alert("导出功能不可用，请稍后重试。");
                            return;
                        }
                        saveModelButton.disabled = true;
                        saveModelButton.textContent = "…";
                        try {
                            const glb = await BABYLON.GLTF2Export.GLBAsync(scene, "model");
                            glb.downloadFiles();
                        } catch (error) {
                            console.error("GLB 导出失败", error);
                            alert("GLB 导出失败，请查看控制台。");
                        } finally {
                            saveModelButton.disabled = false;
                            saveModelButton.textContent = "💾";
                        }
                    });
                }

                // 加载并应用保存的材质配置
                const savedMaterialConfigs = loadMaterialConfig();
                const sortedMaterials = scene.materials.sort((a, b) => a.name.localeCompare(b.name));
                
                // 应用保存的材质配置
                sortedMaterials.forEach(material => {
                    const config = savedMaterialConfigs[material.name];
                    if (config) {
                        applyMaterialConfig(material, config);
                    }
                });

                const materialItems = [];
                const renderMaterialList = (filterText = "") => {
                    materialList.innerHTML = "";
                    const keyword = filterText.trim().toLowerCase();
                    materialItems.forEach(({ material, element }) => {
                        const match = material.name.toLowerCase().includes(keyword);
                        element.style.display = match ? "flex" : "none";
                        if (match) {
                            materialList.appendChild(element);
                        }
                    });
                };

                sortedMaterials.forEach(material => {
                    const materialItem = document.createElement("div");
                    materialItem.className = "material-item";
                    materialItem.title = material.name; // 悬停显示材质名称

                    const colorCircle = document.createElement("div");
                    colorCircle.className = "color-circle";
                    colorCircle.style.backgroundColor = material.albedoColor ? material.albedoColor.toHexString() : "#ffffff";

                    const materialName = document.createElement("span");
                    materialName.className = "material-name";
                    materialName.innerText = material.name;

                    materialItem.appendChild(colorCircle);
                    materialItem.appendChild(materialName);
                    materialItems.push({ material, element: materialItem });
                    materialList.appendChild(materialItem);

                    materialItem.addEventListener("click", () => {
                        document.querySelectorAll(".material-item").forEach(item => item.classList.remove("active"));
                        materialItem.classList.add("active");

                        // 确保左侧面板可见
                        if (!materialPanel.classList.contains("visible")) {
                            materialPanel.classList.add("visible");
                            toggleLeftPanelButton.classList.add("panel-visible");
                        }
                        materialDetailHeader.innerText = `材质: ${material.name}`;
                        materialProperties.innerHTML = "";

                        // 使用与右侧相同的折叠样式
                        const createMaterialSection = (title, isOpen = false) => {
                            const section = document.createElement("div");
                            section.className = "collapsible sub" + (isOpen ? " open" : "");
                            section.innerText = title;
                            
                            const content = document.createElement("div");
                            content.className = "collapsible-content";
                            if (!isOpen) {
                                content.style.maxHeight = "0";
                            }
                            
                            section.addEventListener("click", () => {
                                section.classList.toggle("open");
                                if (section.classList.contains("open")) {
                                    content.style.maxHeight = "2000px";
                                } else {
                                    content.style.maxHeight = "0";
                                }
                            });
                            
                            return { section, content };
                        };

                        const addControlGroup = (items) => {
                            const group = document.createElement("div");
                            group.className = "control-group";
                            items.forEach(item => group.appendChild(item));
                            return group;
                        };

                        const addColorPicker = (labelText, color, onChange) => {
                            const label = document.createElement("label");
                            label.innerText = labelText;
                            label.style.display = "block";

                            const input = document.createElement("input");
                            input.type = "color";
                            input.value = color.toHexString();
                            input.addEventListener("input", (event) => {
                                const newColor = BABYLON.Color3.FromHexString(event.target.value);
                                onChange(newColor);
                            });

                            label.appendChild(input);
                            return label;
                        };

                        const addRangeInput = (labelText, value, min, max, step, onChange) => {
                            const label = document.createElement("label");
                            label.innerText = labelText;
                            label.style.display = "block";

                            const input = document.createElement("input");
                            input.type = "range";
                            input.min = min;
                            input.max = max;
                            input.step = step;
                            input.value = value;
                            
                            const numberInput = document.createElement("input");
                            numberInput.type = "number";
                            // 移除min/max限制，允许突破范围
                            numberInput.step = step;
                            numberInput.value = value;

                            const wrapper = document.createElement("div");
                            wrapper.className = "range-row";
                            wrapper.appendChild(input);
                            wrapper.appendChild(numberInput);

                            const syncFromRange = () => {
                                const val = parseFloat(input.value);
                                numberInput.value = val;
                                onChange(val);
                            };

                            const syncFromNumber = () => {
                                const val = parseFloat(numberInput.value);
                                if (!Number.isNaN(val)) {
                                    // 如果数值在范围内，同步滑块
                                    if (val >= min && val <= max) {
                                        input.value = val;
                                    }
                                    onChange(val);
                                }
                            };

                            input.addEventListener("input", syncFromRange);
                            numberInput.addEventListener("input", syncFromNumber);
                            numberInput.addEventListener("change", syncFromNumber);

                            label.appendChild(wrapper);
                            return label;
                        };

                        const addCheckbox = (labelText, checked, onChange) => {
                            const label = document.createElement("label");
                            label.innerText = labelText;
                            label.style.display = "block";

                            const input = document.createElement("input");
                            input.type = "checkbox";
                            input.checked = checked;
                            input.style.marginLeft = "5px";
                            input.addEventListener("change", (event) => {
                                onChange(event.target.checked);
                            });

                            label.appendChild(input);
                            return label;
                        };

                        const { section: baseSection, content: baseContent } = createMaterialSection("基础属性", true);
                        const baseGroup = addControlGroup([
                            addColorPicker("基础色:", material.albedoColor || BABYLON.Color3.White(), (color) => {
                                material.albedoColor = color;
                                colorCircle.style.backgroundColor = color.toHexString();
                                saveMaterialConfig(material.name, "albedoColor", color.toHexString());
                            }),
                            addRangeInput("金属度:", material.metallic || 0, 0, 1, 0.01, (value) => {
                                material.metallic = value;
                                saveMaterialConfig(material.name, "metallic", value);
                            }),
                            addRangeInput("粗糙度:", material.roughness || 0, 0, 1, 0.01, (value) => {
                                material.roughness = value;
                                saveMaterialConfig(material.name, "roughness", value);
                            }),
                            addColorPicker("发光颜色:", material.emissiveColor || BABYLON.Color3.Black(), (color) => {
                                material.emissiveColor = color;
                                saveMaterialConfig(material.name, "emissiveColor", color.toHexString());
                            }),
                            addRangeInput("发光强度:", material.emissiveIntensity || 0, 0, 10, 0.1, (value) => {
                                material.emissiveIntensity = value;
                                saveMaterialConfig(material.name, "emissiveIntensity", value);
                            }),
                            addRangeInput("透明度:", material.alpha || 1, 0, 1, 0.01, (value) => {
                                material.alpha = value;
                                saveMaterialConfig(material.name, "alpha", value);
                            }),
                            addRangeInput("透明模式:", material.transparencyMode !== null ? material.transparencyMode : 0, 0, 2, 1, (value) => {
                                material.transparencyMode = parseInt(value);
                                material.markAsDirty(BABYLON.Material.MiscDirtyFlag);
                                saveMaterialConfig(material.name, "transparencyMode", parseInt(value));
                            }),
                            addRangeInput("折射率 (IOR):", material.indexOfRefraction || 1.5, 1, 3, 0.01, (value) => {
                                material.indexOfRefraction = value;
                                saveMaterialConfig(material.name, "indexOfRefraction", value);
                            })
                        ]);
                        baseContent.appendChild(baseGroup);
                        materialProperties.appendChild(baseSection);
                        materialProperties.appendChild(baseContent);

                        const { section: bumpSection, content: bumpContent } = createMaterialSection("法线和凹凸");
                        const bumpGroup = addControlGroup([
                            addRangeInput("凹凸强度:", material.bumpTexture ? material.bumpTexture.level : 0.5, 0, 2, 0.01, (value) => {
                                if (material.bumpTexture) {
                                    material.bumpTexture.level = value;
                                    saveMaterialConfig(material.name, "bumpLevel", value);
                                }
                            }),
                            addCheckbox("反转法线 X:", material.invertNormalMapX || false, (checked) => {
                                material.invertNormalMapX = checked;
                                saveMaterialConfig(material.name, "invertNormalMapX", checked);
                            }),
                            addCheckbox("反转法线 Y:", material.invertNormalMapY || false, (checked) => {
                                material.invertNormalMapY = checked;
                                saveMaterialConfig(material.name, "invertNormalMapY", checked);
                            })
                        ]);
                        bumpContent.appendChild(bumpGroup);
                        materialProperties.appendChild(bumpSection);
                        materialProperties.appendChild(bumpContent);

                        const { section: reflectionSection, content: reflectionContent } = createMaterialSection("反射和高光");
                        const reflectionGroup = addControlGroup([
                            addColorPicker("反射颜色:", material.reflectivityColor || BABYLON.Color3.White(), (color) => {
                                material.reflectivityColor = color;
                                saveMaterialConfig(material.name, "reflectivityColor", color.toHexString());
                            }),
                            addColorPicker("高光颜色:", material.specularColor || BABYLON.Color3.White(), (color) => {
                                material.specularColor = color;
                                saveMaterialConfig(material.name, "specularColor", color.toHexString());
                            }),
                            addRangeInput("高光强度:", material.specularIntensity || 1, 0, 1, 0.01, (value) => {
                                material.specularIntensity = value;
                                saveMaterialConfig(material.name, "specularIntensity", value);
                            }),
                            addColorPicker("环境光颜色:", material.ambientColor || BABYLON.Color3.Black(), (color) => {
                                material.ambientColor = color;
                                saveMaterialConfig(material.name, "ambientColor", color.toHexString());
                            })
                        ]);
                        reflectionContent.appendChild(reflectionGroup);
                        materialProperties.appendChild(reflectionSection);
                        materialProperties.appendChild(reflectionContent);

                        const { section: sssSection, content: sssContent } = createMaterialSection("次表面散射");
                        const sssGroup = addControlGroup([
                            addCheckbox("启用折射:", material.subSurface?.isRefractionEnabled || false, (checked) => {
                                material.subSurface.isRefractionEnabled = checked;
                                saveMaterialConfig(material.name, "refractionEnabled", checked);
                            }),
                            addRangeInput("折射率:", material.subSurface?.indexOfRefraction || 1.5, 1, 2.5, 0.01, (value) => {
                                material.subSurface.indexOfRefraction = value;
                                saveMaterialConfig(material.name, "indexOfRefraction", value);
                            }),
                            addCheckbox("启用半透明:", material.subSurface?.isTranslucencyEnabled || false, (checked) => {
                                material.subSurface.isTranslucencyEnabled = checked;
                                saveMaterialConfig(material.name, "translucencyEnabled", checked);
                            }),
                            addRangeInput("半透明强度:", material.subSurface?.translucencyIntensity || 0, 0, 1, 0.01, (value) => {
                                material.subSurface.translucencyIntensity = value;
                                saveMaterialConfig(material.name, "translucencyIntensity", value);
                            }),
                            addColorPicker("半透明颜色:", material.subSurface?.tintColor || BABYLON.Color3.White(), (color) => {
                                if (material.subSurface) {
                                    material.subSurface.tintColor = color;
                                    saveMaterialConfig(material.name, "subSurfaceTintColor", color.toHexString());
                                }
                            })
                        ]);
                        sssContent.appendChild(sssGroup);
                        materialProperties.appendChild(sssSection);
                        materialProperties.appendChild(sssContent);

                        const { section: clearCoatSection, content: clearCoatContent } = createMaterialSection("清漆层");
                        const clearCoatGroup = addControlGroup([
                            addCheckbox("启用清漆层:", material.clearCoat?.isEnabled || false, (checked) => {
                                material.clearCoat.isEnabled = checked;
                                saveMaterialConfig(material.name, "clearCoatEnabled", checked);
                            }),
                            addRangeInput("清漆层强度:", material.clearCoat?.intensity || 0, 0, 1, 0.01, (value) => {
                                material.clearCoat.intensity = value;
                                saveMaterialConfig(material.name, "clearCoatIntensity", value);
                            }),
                            addRangeInput("清漆层粗糙度:", material.clearCoat?.roughness || 0, 0, 1, 0.01, (value) => {
                                material.clearCoat.roughness = value;
                                saveMaterialConfig(material.name, "clearCoatRoughness", value);
                            }),
                            addRangeInput("清漆层IOR:", material.clearCoat?.indexOfRefraction || 1.5, 1, 3, 0.01, (value) => {
                                material.clearCoat.indexOfRefraction = value;
                                saveMaterialConfig(material.name, "clearCoatIOR", value);
                            })
                        ]);
                        clearCoatContent.appendChild(clearCoatGroup);
                        materialProperties.appendChild(clearCoatSection);
                        materialProperties.appendChild(clearCoatContent);

                        const { section: sheenSection, content: sheenContent } = createMaterialSection("绒面效果");
                        const sheenGroup = addControlGroup([
                            addCheckbox("启用绒面效果:", material.sheen?.isEnabled || false, (checked) => {
                                material.sheen.isEnabled = checked;
                                saveMaterialConfig(material.name, "sheenEnabled", checked);
                            }),
                            addRangeInput("绒面强度:", material.sheen?.intensity || 0, 0, 1, 0.01, (value) => {
                                material.sheen.intensity = value;
                                saveMaterialConfig(material.name, "sheenIntensity", value);
                            }),
                            addColorPicker("绒面颜色:", material.sheen?.color || BABYLON.Color3.White(), (color) => {
                                material.sheen.color = color;
                                saveMaterialConfig(material.name, "sheenColor", color.toHexString());
                            }),
                            addRangeInput("绒面粗糙度:", material.sheen?.roughness || 0.1, 0, 1, 0.01, (value) => {
                                if (material.sheen) {
                                    material.sheen.roughness = value;
                                    saveMaterialConfig(material.name, "sheenRoughness", value);
                                }
                            })
                        ]);
                        sheenContent.appendChild(sheenGroup);
                        materialProperties.appendChild(sheenSection);
                        materialProperties.appendChild(sheenContent);

                        const { section: anisotropySection, content: anisotropyContent } = createMaterialSection("各向异性");
                        const anisotropyGroup = addControlGroup([
                            addCheckbox("启用各向异性:", material.anisotropy?.isEnabled || false, (checked) => {
                                material.anisotropy.isEnabled = checked;
                                saveMaterialConfig(material.name, "anisotropyEnabled", checked);
                            }),
                            addRangeInput("各向异性强度:", material.anisotropy?.intensity || 0, 0, 1, 0.01, (value) => {
                                if (material.anisotropy) {
                                    material.anisotropy.intensity = value;
                                    saveMaterialConfig(material.name, "anisotropyIntensity", value);
                                }
                            }),
                            addRangeInput("各向异性角度:", material.anisotropy?.angle || 0, 0, Math.PI * 2, 0.01, (value) => {
                                if (material.anisotropy) {
                                    material.anisotropy.angle = value;
                                    saveMaterialConfig(material.name, "anisotropyAngle", value);
                                }
                            })
                        ]);
                        anisotropyContent.appendChild(anisotropyGroup);
                        materialProperties.appendChild(anisotropySection);
                        materialProperties.appendChild(anisotropyContent);
                    });
                });

                renderMaterialList("");

                // 等场景真正 ready（含材质/纹理/着色器准备）后再结束 loading
                scene.executeWhenReady(() => {
                    hideLoadingBar();
                });
            }, (evt) => {
                // 加载进度回调
                if (evt && evt.lengthComputable && evt.total > 0) {
                    const progress = Math.round((evt.loaded / evt.total) * 100);
                    // 保持署名文本，不在这里覆盖
                    void progress;
                }
            }, (evt) => {
                console.warn("模型加载失败", evt);
                showLoadError("模型加载失败");
                startRenderLoop();
            });

            return scene;
        };

        scene = createScene();

        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
